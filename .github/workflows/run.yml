name: Run Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  

jobs:
  run-bot:
    runs-on: ubuntu-latest

    concurrency:
      group: bot-restart
      cancel-in-progress: false

    env:
      TOKEN: ${{ secrets.TOKEN }}

    steps:
      - name: Setup Actions
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Fetch Token
        run: |
          sed -i "s/TokenTimeIsBackBuddyss/${{ secrets.LICHESS_KEY }}/g" config.yml

      - name: Download latest Stockfish dev 
        run: |
          curl -sSL https://raw.githubusercontent.com/ppigazzini/stockfish-downloader/main/posix_helper.sh | sh -s
          tar -xf stockfish-*.tar && rm stockfish-*.tar
          mv stockfish/stockfish-* engines/stockfish && rm -r stockfish
          chmod +x engines/stockfish engines/fairy-stockfish_x86-64-bmi2

      - name: Run Bot
        run: |
          echo "Starting bot..."
          python3 -u user_interface.py "join royalracer-fans" "tournament VH722Lmw" &
          PID=$!
          
          # Auto-exit after 350 minutes (so restart runs without overlap)
          ( sleep 20700 && echo "Time up. Killing bot..." && kill -SIGTERM $PID ) &
          
          wait $PID
          echo "Bot ended cleanly."


      - name: 🔁 Self-Restart (Fire-and-Forget)
        if: always()
        run: gh workflow run run.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
