name: Extract existing ZIP in engines folder

on:
  workflow_dispatch:  # run manually when you want to extract

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract contents of ZIP inside engines/
        run: |
          mkdir -p engines
          for zipfile in engines/*.zip; do
            echo "Extracting $zipfile ..."
            unzip -o "$zipfile" -d engines
          done

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add engines
          git commit -m "Extract ZIP contents into engines folder" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main
