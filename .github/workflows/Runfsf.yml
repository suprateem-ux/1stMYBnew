name: Extract Fairy-Stockfish

on:
  workflow_dispatch:  # Run manually, or add "push:" if you want auto-trigger

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Fairy-Stockfish zip
        run: |
          mkdir -p engines
          curl -L -o engines/fairy-stockfish.zip "https://github.com/suprateem-ux/1stMYBnew/raw/main/engines/fairy-stockfish-linux-x86-64-bmi2.zip"

      - name: Extract Fairy-Stockfish
        run: |
          unzip -o engines/fairy-stockfish.zip -d engines
          rm engines/fairy-stockfish.zip

      - name: List contents
        run: ls -R engines

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add engines
          git commit -m "Add extracted Fairy-Stockfish contents" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main
